# Render Blueprint: веб-сервис на Docker + база PostgreSQL.
# Документация: https://render.com/docs/blueprint-spec
#
# После подключения репозитория Render создаст базу данных и веб-сервис.
# Строка подключения к БД и SECRET_KEY подставляются автоматически,
# health check указывает на публичный эндпоинт /health.

databases:
  - name: library-db
    databaseName: library
    user: library
    plan: free

services:
  - type: web
    name: library-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
